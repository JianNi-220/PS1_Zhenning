<line class="edge" x1="710" y1="315.0" x2="805" y2="345.0" stroke="#6C58A6"/>
<line class="edge" x1="1045" y1="162.5" x2="1120" y2="317.5" stroke="#6C58A6"/>
<line class="edge" x1="1045" y1="345.0" x2="1120" y2="317.5" stroke="#6C58A6"/>
<line class="edge" x1="1045" y1="552.5" x2="1120" y2="552.5" stroke="#B94D6B"/>
<line class="edge" x1="1250.0" y1="490" x2="1250.0" y2="390" stroke="#B94D6B"/>
<line class="edge" x1="1380" y1="317.5" x2="1435" y2="165.0" stroke="#2D7C83"/>
<line class="edge" x1="1380" y1="317.5" x2="1435" y2="347.5" stroke="#2D7C83"/>
<line class="edge" x1="710" y1="315.0" x2="1435" y2="550.0" stroke="#6C58A6"/>
<line class="edge-dashed" x1="710" y1="315.0" x2="762.5" y2="620"/>
<rect class="box" x="55" y="105" width="270" height="210" rx="15" fill="#DDEBFA" stroke="#3B73A8"/>
<text x="190.0" y="285" text-anchor="middle" font-size="19" font-weight="700" fill="#17324D">Platform selling rule</text>
<text x="190.0" y="247" text-anchor="middle" font-size="16" font-weight="400" fill="#17324D">Fixed intermediary margin</text>
<text x="190.0" y="222" text-anchor="middle" font-size="16" font-weight="400" fill="#17324D">benchmark: m = 1</text>
<text x="190.0" y="197" text-anchor="middle" font-size="16" font-weight="400" fill="#17324D"></text>
<text x="190.0" y="172" text-anchor="middle" font-size="16" font-weight="400" fill="#17324D">OR</text>
<text x="190.0" y="147" text-anchor="middle" font-size="16" font-weight="400" fill="#17324D"></text>
<text x="190.0" y="122" text-anchor="middle" font-size="16" font-weight="400" fill="#17324D">Intermediary-chosen margin</text>
<rect class="box" x="55" y="390" width="270" height="150" rx="15" fill="#E6F4EA" stroke="#39845A"/>
<text x="190.0" y="510" text-anchor="middle" font-size="19" font-weight="700" fill="#19452C">Farmer participation</text>
<text x="190.0" y="485" text-anchor="middle" font-size="16" font-weight="400" fill="#19452C">and pooled supply</text>
<text x="190.0" y="460" text-anchor="middle" font-size="16" font-weight="400" fill="#19452C"></text>
<text x="190.0" y="435" text-anchor="middle" font-size="16" font-weight="400" fill="#19452C">Farmers choose whether to join</text>
<text x="190.0" y="410" text-anchor="middle" font-size="16" font-weight="400" fill="#19452C">and pool products</text>
<rect class="box" x="55" y="620" width="270" height="125" rx="15" fill="#FFF1D6" stroke="#B97916"/>
<text x="190.0" y="715" text-anchor="middle" font-size="19" font-weight="700" fill="#68450A">Coordination cost K</text>
<text x="190.0" y="677" text-anchor="middle" font-size="16" font-weight="400" fill="#68450A">meetings, sorting,</text>
<text x="190.0" y="652" text-anchor="middle" font-size="16" font-weight="400" fill="#68450A">joint delivery</text>
<rect class="box" x="410" y="205" width="300" height="220" rx="15" fill="#E5E0F6" stroke="#6C58A6"/>
<text x="560.0" y="395" text-anchor="middle" font-size="19" font-weight="700" fill="#33265E">Intermediary decisions</text>
<text x="560.0" y="357" text-anchor="middle" font-size="16" font-weight="400" fill="#33265E">effort e</text>
<text x="560.0" y="332" text-anchor="middle" font-size="16" font-weight="400" fill="#33265E">product search and selection</text>
<text x="560.0" y="307" text-anchor="middle" font-size="16" font-weight="400" fill="#33265E">listing and delivery effort</text>
<rect class="box" x="805" y="105" width="240" height="115" rx="15" fill="#E5E0F6" stroke="#6C58A6"/>
<text x="925.0" y="190" text-anchor="middle" font-size="19" font-weight="700" fill="#33265E">Retail price</text>
<text x="925.0" y="165" text-anchor="middle" font-size="16" font-weight="400" fill="#33265E">p = w + m</text>
<rect class="box" x="805" y="280" width="240" height="130" rx="15" fill="#E5E0F6" stroke="#6C58A6"/>
<text x="925.0" y="380" text-anchor="middle" font-size="19" font-weight="700" fill="#33265E">Products offered</text>
<text x="925.0" y="342" text-anchor="middle" font-size="16" font-weight="400" fill="#33265E">availability and</text>
<text x="925.0" y="317" text-anchor="middle" font-size="16" font-weight="400" fill="#33265E">product variety</text>
<rect class="box" x="1120" y="245" width="260" height="145" rx="15" fill="#D9F0F2" stroke="#2D7C83"/>
<text x="1250.0" y="360" text-anchor="middle" font-size="19" font-weight="700" fill="#174F54">Completed purchases</text>
<text x="1250.0" y="322" text-anchor="middle" font-size="16" font-weight="400" fill="#174F54">q(m,e,r)</text>
<rect class="box" x="805" y="490" width="240" height="125" rx="15" fill="#FDE4EA" stroke="#B94D6B"/>
<text x="925.0" y="585" text-anchor="middle" font-size="19" font-weight="700" fill="#652238">Reputation information r</text>
<text x="925.0" y="547" text-anchor="middle" font-size="16" font-weight="400" fill="#652238">sparse vs. verified</text>
<text x="925.0" y="522" text-anchor="middle" font-size="16" font-weight="400" fill="#652238">seller record</text>
<rect class="box" x="1120" y="490" width="260" height="125" rx="15" fill="#FDE4EA" stroke="#B94D6B"/>
<text x="1250.0" y="585" text-anchor="middle" font-size="19" font-weight="700" fill="#652238">Household trust and</text>
<text x="1250.0" y="560" text-anchor="middle" font-size="16" font-weight="400" fill="#652238">willingness to pay</text>
<text x="1250.0" y="535" text-anchor="middle" font-size="16" font-weight="400" fill="#652238"></text>
<text x="1250.0" y="510" text-anchor="middle" font-size="16" font-weight="400" fill="#652238">behavioral demand response</text>
<rect class="box" x="1435" y="100" width="220" height="130" rx="15" fill="#E6F4EA" stroke="#39845A"/>
<text x="1545.0" y="200" text-anchor="middle" font-size="19" font-weight="700" fill="#19452C">Farmer net earnings</text>
<text x="1545.0" y="162" text-anchor="middle" font-size="16" font-weight="400" fill="#19452C">pi_F = (w - c)q - K</text>
<rect class="box" x="1435" y="275" width="220" height="145" rx="15" fill="#E6F4EA" stroke="#39845A"/>
<text x="1545.0" y="390" text-anchor="middle" font-size="19" font-weight="700" fill="#19452C">Household product access</text>
<text x="1545.0" y="352" text-anchor="middle" font-size="16" font-weight="400" fill="#19452C">affordable availability</text>
<text x="1545.0" y="327" text-anchor="middle" font-size="16" font-weight="400" fill="#19452C">and completed purchases</text>
<rect class="box" x="1435" y="490" width="220" height="120" rx="15" fill="#E5E0F6" stroke="#6C58A6"/>
<text x="1545.0" y="580" text-anchor="middle" font-size="19" font-weight="700" fill="#33265E">Intermediary profit</text>
<text x="1545.0" y="542" text-anchor="middle" font-size="16" font-weight="400" fill="#33265E">pi_I = mq - g(e)</text>
<rect class="box" x="410" y="620" width="705" height="125" rx="15" fill="#F2F4F6" stroke="#607583"/>
<text x="762.5" y="715" text-anchor="middle" font-size="19" font-weight="700" fill="#253B48">Computational evaluation</text>
<text x="762.5" y="677" text-anchor="middle" font-size="16" font-weight="400" fill="#253B48">grid search - baseline comparison</text>
<text x="762.5" y="652" text-anchor="middle" font-size="16" font-weight="400" fill="#253B48">coordination-cost sensitivity</text>
<text x="762.5" y="627" text-anchor="middle" font-size="16" font-weight="400" fill="#253B48">trust and demand sensitivity</text>
<text x="410" y="780" font-size="15" font-style="italic" fill="#607583">Synthetic model outputs are hypotheses and calibration results, not field findings.</text></svg>
