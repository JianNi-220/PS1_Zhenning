<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="850" viewBox="0 0 1760 850">
<title>Intermediary margin governance and real household access</title>
<desc>Fixed or intermediary-chosen margins change intermediary effort and product selection, which affect price, completed purchases, farmer net earnings and household product access. Coordination cost affects farmer participation, and reputation information affects trust and willingness to pay.</desc>
<style>text{font-family:Helvetica,Arial,sans-serif;fill:#17324D} .box{stroke-width:2} .edge{fill:none;stroke-width:3;marker-end:url(#arrow)} .edge-dashed{fill:none;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#arrow-open)}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#607583"/></marker><marker id="arrow-open" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#607583" stroke-width="1.5"/></marker></defs>
<text x="45" y="48" font-size="25" font-weight="700">Intermediary margin governance and real household access</text>
<line class="edge" x1="325" y1="210.0" x2="410" y2="315.0" stroke="#3B73A8"/>
<line class="edge" x1="325" y1="465.0" x2="410" y2="315.0" stroke="#39845A"/>
